# models/intermediate/_int_models.yml

version: 2

models:
  - name: int_economic_indicators_pivoted
    description: "Wide-format table with one row per month, one column per indicator"
    columns:
      - name: observation_month
        description: "First day of the month"
        tests:
          - unique
          - not_null

  - name: int_indicators_with_changes
    description: "Indicators enriched with MoM, YoY changes and rolling averages"
    columns:
      - name: observation_month
        tests:
          - unique
          - not_null

  - name: int_recession_signals
    description: "Recession warning signals derived from economic indicators"
    columns:
      - name: observation_month
        tests:
          - unique
          - not_null
      - name: recession_risk_level
        description: >
          LOW / MODERATE / ELEVATED / HIGH based on active signal count, or
          INSUFFICIENT DATA when fewer than min_measured_signals of the five
          were backed by a value fresh enough to count. Affects the twelve
          warm-up months of 2000, where only two signals have any history
          behind them.
        tests:
          - accepted_values:
              arguments:
                values: ['LOW', 'MODERATE', 'ELEVATED', 'HIGH', 'INSUFFICIENT DATA']
      - name: recession_signal_measured_count
        description: >
          How many of the five signals were decided on a value no older than
          signal_staleness_months. The risk rule, both marts and the dashboard
          header all read this one number; "1 of 5 active" means nothing
          without it.
        tests:
          - not_null
      - name: recession_signal_unknown_count
        description: "5 - recession_signal_measured_count"
        tests:
          - not_null
      - name: sahm_data_complete
        description: >
          False when no Sahm value within signal_staleness_months is available,
          so a 0 signal can be read as "no data" rather than "not triggered".
          The raw sahm_rule_value is still null for Oct, Nov and Dec 2025 — the
          three months whose 3-month averages touch the missing October 2025
          unemployment rate — but Oct and Nov carry forward from September, so
          only Dec 2025 is incomplete, along with the series warm-up in 2000.
        tests:
          - not_null
      - name: treasury_spread_data_complete
        description: "False when no 10Y-2Y spread within the staleness limit is available"
        tests:
          - not_null
      - name: inflation_data_complete
        description: >
          False when no YoY inflation rate within the staleness limit is
          available. Note this carries inflation_rate_yoy, never cpi_index:
          filling the October 2025 CPI hole would give October 2026 a
          fabricated year-ago baseline.
        tests:
          - not_null
      - name: consumer_sentiment_data_complete
        description: >
          False when no sentiment reading within the staleness limit is
          available. UMCSENT publishes with a lag, so the current month is
          routinely carried forward from the previous one.
        tests:
          - not_null
      - name: fed_funds_data_complete
        description: "False when no YoY fed funds change within the staleness limit is available"
        tests:
          - not_null


unit_tests:

  # ------------------------------------------------------------------
  # The Sahm Rule baseline is the minimum of the 3-month AVERAGES over
  # the PREVIOUS 12 months (t-12..t-1). These fixtures hold unemployment
  # flat at 4.5 with an early dip to 3.0, chosen so every 3-month average
  # divides exactly and the expected values are unambiguous.
  # ------------------------------------------------------------------

  - name: test_sahm_baseline_window_boundary
    model: int_indicators_with_changes
    description: >
      The window includes t-12 and excludes t-13. The dip produces a 3.0 average
      at month 3, which is month t-12 for 2025-03 (baseline 3.0) and month t-13
      for 2025-04 (baseline 3.5, the next-lowest average). The old
      "rows between 11 preceding and current row" window gets both wrong.
      Months 1-12 have no baseline because 12 prior months do not exist yet,
      which is also the warm-up case.
    given:
      - input: ref('int_economic_indicators_pivoted')
        format: csv
        fixture: sahm_window_input
    expect:
      format: csv
      fixture: sahm_window_expected

  - name: test_sahm_baseline_recovers_after_missing_month
    model: int_indicators_with_changes
    description: >
      The D-prime rule for data holes, modelled on October 2025. A null
      unemployment rate nulls the three 3-month averages whose window touches
      it (2024-10/11/12) rather than silently averaging two months. The baseline
      then carries on from the averages that DO exist, so 2025-01 onward still
      resolves to 3.0 even though three of its twelve window months are empty.
      A strict "all 12 must be present" baseline would return null here, blanking
      the indicator for a year after every hole.
    given:
      - input: ref('int_economic_indicators_pivoted')
        format: csv
        fixture: sahm_gap_input
    expect:
      format: csv
      fixture: sahm_gap_expected

  - name: test_sahm_three_month_average_requires_three_observations
    model: int_indicators_with_changes
    description: >
      avg() ignores nulls, so without the count guard a two-month average would
      be published under the name unemployment_rate_3m_avg. All three months
      whose window touches the hole must be null, and the average must resume
      the first month the window clears it.
    given:
      - input: ref('int_economic_indicators_pivoted')
        rows:
          - {observation_month: "2024-01-01", unemployment_rate: 4.0}
          - {observation_month: "2024-02-01", unemployment_rate: 4.0}
          - {observation_month: "2024-03-01", unemployment_rate: 4.0}
          - {observation_month: "2024-04-01", unemployment_rate: }
          - {observation_month: "2024-05-01", unemployment_rate: 4.0}
          - {observation_month: "2024-06-01", unemployment_rate: 4.0}
          - {observation_month: "2024-07-01", unemployment_rate: 4.0}
    expect:
      rows:
          - {observation_month: "2024-01-01", unemployment_rate_3m_avg: }
          - {observation_month: "2024-02-01", unemployment_rate_3m_avg: }
          - {observation_month: "2024-03-01", unemployment_rate_3m_avg: 4.0}
          - {observation_month: "2024-04-01", unemployment_rate_3m_avg: }
          - {observation_month: "2024-05-01", unemployment_rate_3m_avg: }
          - {observation_month: "2024-06-01", unemployment_rate_3m_avg: }
          - {observation_month: "2024-07-01", unemployment_rate_3m_avg: 4.0}

  # ------------------------------------------------------------------
  # Threshold behaviour. These take the averages as given, so they test
  # only the subtraction, the rounding and the >= comparison.
  # ------------------------------------------------------------------

  - name: test_sahm_signal_triggers_at_threshold
    model: int_recession_signals
    description: >
      0.50 exactly must trigger — the rule is "0.50 percentage points or more".
      The signal is decided on the same rounded number the dashboard displays,
      so a value shown as 0.50 can never sit next to a 0 signal.
    given:
      - input: ref('int_indicators_with_changes')
        rows:
          - {observation_month: "2024-07-01", unemployment_rate_3m_avg: 4.10, unemployment_rate_3m_avg_12m_low: 3.60}
    expect:
      rows:
          - {observation_month: "2024-07-01", sahm_rule_value: 0.50, signal_sahm_rule: 1, sahm_data_complete: true}

  - name: test_sahm_signal_just_below_threshold
    model: int_recession_signals
    description: "0.49 must not trigger."
    given:
      - input: ref('int_indicators_with_changes')
        rows:
          - {observation_month: "2024-07-01", unemployment_rate_3m_avg: 4.09, unemployment_rate_3m_avg_12m_low: 3.60}
    expect:
      rows:
          - {observation_month: "2024-07-01", sahm_rule_value: 0.49, signal_sahm_rule: 0, sahm_data_complete: true}

  - name: test_sahm_value_negative_in_expansion
    model: int_recession_signals
    description: >
      A negative value is correct, not a bug: the baseline excludes the current
      month, so a falling unemployment rate puts the current average below it.
      The value must survive unclamped and still count as complete data.
    given:
      - input: ref('int_indicators_with_changes')
        rows:
          - {observation_month: "2026-08-01", unemployment_rate_3m_avg: 3.50, unemployment_rate_3m_avg_12m_low: 3.60}
    expect:
      rows:
          - {observation_month: "2026-08-01", sahm_rule_value: -0.10, signal_sahm_rule: 0, sahm_data_complete: true}

  - name: test_sahm_data_complete_flags_missing_data
    model: int_recession_signals
    description: >
      A null value with nothing earlier to carry forward: the signal still
      reports 0, because it feeds a sum, and sahm_data_complete is what
      separates that 0 from a real "not triggered" reading. This is the
      single-row case — see the staleness tests below for a null that DOES
      have a recent value behind it.
    given:
      - input: ref('int_indicators_with_changes')
        rows:
          - {observation_month: "2025-11-01", unemployment_rate_3m_avg: , unemployment_rate_3m_avg_12m_low: 3.60}
    expect:
      rows:
          - {observation_month: "2025-11-01", sahm_rule_value: , signal_sahm_rule: 0, sahm_data_complete: false}

  # ------------------------------------------------------------------
  # Carry-forward and the staleness limit (signal_staleness_months = 2).
  #
  # These fixtures are multi-row, unlike the threshold tests above: a
  # carried value only exists if there is an earlier row to carry it from.
  # ------------------------------------------------------------------

  - name: test_sahm_carries_forward_within_limit
    model: int_recession_signals
    description: >
      The real Oct-Dec 2025 shape. The October 2025 unemployment hole nulls
      three consecutive 3-month averages. October and November are 1 and 2
      months from September's real value, so they carry it and stay complete;
      December is 3 months out and goes unknown.
    given:
      - input: ref('int_indicators_with_changes')
        rows:
          - {observation_month: "2025-09-01", unemployment_rate_3m_avg: 4.30, unemployment_rate_3m_avg_12m_low: 3.60}
          - {observation_month: "2025-10-01", unemployment_rate_3m_avg: , unemployment_rate_3m_avg_12m_low: 3.60}
          - {observation_month: "2025-11-01", unemployment_rate_3m_avg: , unemployment_rate_3m_avg_12m_low: 3.60}
          - {observation_month: "2025-12-01", unemployment_rate_3m_avg: , unemployment_rate_3m_avg_12m_low: 3.60}
    expect:
      rows:
          - {observation_month: "2025-09-01", sahm_rule_value_effective: 0.70, sahm_rule_value_as_of_month: "2025-09-01", sahm_data_complete: true,  signal_sahm_rule: 1}
          - {observation_month: "2025-10-01", sahm_rule_value_effective: 0.70, sahm_rule_value_as_of_month: "2025-09-01", sahm_data_complete: true,  signal_sahm_rule: 1}
          - {observation_month: "2025-11-01", sahm_rule_value_effective: 0.70, sahm_rule_value_as_of_month: "2025-09-01", sahm_data_complete: true,  signal_sahm_rule: 1}
          - {observation_month: "2025-12-01", sahm_rule_value_effective: 0.70, sahm_rule_value_as_of_month: "2025-09-01", sahm_data_complete: false, signal_sahm_rule: 0}

  - name: test_stale_value_cannot_trigger_a_signal
    model: int_recession_signals
    description: >
      Beyond the limit the carried value is still reported in *_effective for
      provenance, but it must not fire the signal — otherwise a six-month-old
      inversion would keep showing as a live warning.
    given:
      - input: ref('int_indicators_with_changes')
        rows:
          - {observation_month: "2026-01-01", treasury_spread_10y2y: -0.50}
          - {observation_month: "2026-02-01", treasury_spread_10y2y: }
          - {observation_month: "2026-03-01", treasury_spread_10y2y: }
          - {observation_month: "2026-04-01", treasury_spread_10y2y: }
    expect:
      rows:
          - {observation_month: "2026-01-01", signal_yield_curve_inverted: 1, treasury_spread_data_complete: true}
          - {observation_month: "2026-02-01", signal_yield_curve_inverted: 1, treasury_spread_data_complete: true}
          - {observation_month: "2026-03-01", signal_yield_curve_inverted: 1, treasury_spread_data_complete: true}
          - {observation_month: "2026-04-01", signal_yield_curve_inverted: 0, treasury_spread_data_complete: false}

  - name: test_sentiment_gap_keeps_september_signal_in_october
    model: int_recession_signals
    description: >
      The regression this issue exists for. Sentiment was 48.1 in September
      2026 — below the threshold, so the signal was active and the composite
      read MODERATE. October's UMCSENT had not published. The old code
      answered the null with 0 and dropped the whole dashboard to LOW; now
      October carries September's reading and stays MODERATE.
    given:
      - input: ref('int_indicators_with_changes')
        rows:
          - {observation_month: "2026-09-01", consumer_sentiment: 48.1, treasury_spread_10y2y: 0.38, inflation_rate_yoy: 3.72, fed_funds_rate_yoy_change: -0.21, unemployment_rate_3m_avg: 4.30, unemployment_rate_3m_avg_12m_low: 4.30}
          - {observation_month: "2026-10-01", consumer_sentiment: , treasury_spread_10y2y: 0.38, inflation_rate_yoy: , fed_funds_rate_yoy_change: -0.21, unemployment_rate_3m_avg: 4.30, unemployment_rate_3m_avg_12m_low: 4.30}
    expect:
      rows:
          - {observation_month: "2026-09-01", signal_low_sentiment: 1, recession_signal_count: 1, recession_signal_measured_count: 5, recession_signal_unknown_count: 0, recession_risk_level: "MODERATE"}
          - {observation_month: "2026-10-01", signal_low_sentiment: 1, recession_signal_count: 1, recession_signal_measured_count: 5, recession_signal_unknown_count: 0, recession_risk_level: "MODERATE"}

  - name: test_insufficient_data_when_too_few_signals_measured
    model: int_recession_signals
    description: >
      The series warm-up case. With only two of five signals backed by a
      usable value, no risk level is published — a confident LOW built out of
      three silences is worse than saying nothing. The active count is still a
      real number, so downstream sums keep working.
    given:
      - input: ref('int_indicators_with_changes')
        rows:
          - {observation_month: "2000-01-01", consumer_sentiment: 98.4, treasury_spread_10y2y: -0.11, inflation_rate_yoy: , fed_funds_rate_yoy_change: , unemployment_rate_3m_avg: , unemployment_rate_3m_avg_12m_low: }
    expect:
      rows:
          - {observation_month: "2000-01-01", recession_signal_measured_count: 2, recession_signal_unknown_count: 3, recession_signal_count: 1, recession_risk_level: "INSUFFICIENT DATA"}
  - name: test_inflation_carries_forward_over_the_cpi_gap
    model: int_recession_signals
    description: >
      The October 2025 CPI hole, seen a year later. October 2026 CPI itself
      WAS published — it is the year-ago denominator that is missing, so
      inflation_rate_yoy is null for that month alone. The carried value and
      its as-of month are what keep the signal measured. Note what is NOT
      carried: cpi_index. Filling the raw hole would have October 2026
      compute a year-over-year figure against an invented baseline and
      publish it as a real measurement.
    given:
      - input: ref('int_indicators_with_changes')
        rows:
          - {observation_month: "2026-09-01", inflation_rate_yoy: 3.72}
          - {observation_month: "2026-10-01", inflation_rate_yoy: }
    expect:
      rows:
          - {observation_month: "2026-09-01", inflation_rate_yoy_effective: 3.72, inflation_rate_yoy_as_of_month: "2026-09-01", inflation_data_complete: true, signal_high_inflation: 0}
          - {observation_month: "2026-10-01", inflation_rate_yoy_effective: 3.72, inflation_rate_yoy_as_of_month: "2026-09-01", inflation_data_complete: true, signal_high_inflation: 0}

  - name: test_fed_tightening_carry_and_staleness
    model: int_recession_signals
    description: >
      Both halves of the rule on one fixture: an active tightening signal
      carries for two months and keeps firing, then goes unknown at three.
      The effective value is still reported at month four for provenance —
      it is the flag, not the value, that stops the signal.
    given:
      - input: ref('int_indicators_with_changes')
        rows:
          - {observation_month: "2026-01-01", fed_funds_rate_yoy_change: 1.20}
          - {observation_month: "2026-02-01", fed_funds_rate_yoy_change: }
          - {observation_month: "2026-03-01", fed_funds_rate_yoy_change: }
          - {observation_month: "2026-04-01", fed_funds_rate_yoy_change: }
    expect:
      rows:
          - {observation_month: "2026-01-01", fed_funds_rate_yoy_change_effective: 1.20, fed_funds_rate_yoy_change_as_of_month: "2026-01-01", fed_funds_data_complete: true,  signal_fed_tightening: 1}
          - {observation_month: "2026-02-01", fed_funds_rate_yoy_change_effective: 1.20, fed_funds_rate_yoy_change_as_of_month: "2026-01-01", fed_funds_data_complete: true,  signal_fed_tightening: 1}
          - {observation_month: "2026-03-01", fed_funds_rate_yoy_change_effective: 1.20, fed_funds_rate_yoy_change_as_of_month: "2026-01-01", fed_funds_data_complete: true,  signal_fed_tightening: 1}
          - {observation_month: "2026-04-01", fed_funds_rate_yoy_change_effective: 1.20, fed_funds_rate_yoy_change_as_of_month: "2026-01-01", fed_funds_data_complete: false, signal_fed_tightening: 0}

  - name: test_sentiment_goes_unknown_beyond_limit
    model: int_recession_signals
    description: >
      Sentiment at the far end of the limit. The staleness mechanism itself is
      already proven by the yield-curve test; what this adds is the wiring for
      THIS signal — five near-identical blocks sit side by side in the model,
      and a copy-paste that leaves one block reading another signal's flag
      would pass every other test here. It also exercises a "below threshold"
      rule rather than "below zero", so a carried value sitting under 60 does
      not keep firing forever.
    given:
      - input: ref('int_indicators_with_changes')
        rows:
          - {observation_month: "2026-06-01", consumer_sentiment: 48.1}
          - {observation_month: "2026-07-01", consumer_sentiment: }
          - {observation_month: "2026-08-01", consumer_sentiment: }
          - {observation_month: "2026-09-01", consumer_sentiment: }
    expect:
      rows:
          - {observation_month: "2026-06-01", consumer_sentiment_data_complete: true,  signal_low_sentiment: 1}
          - {observation_month: "2026-07-01", consumer_sentiment_data_complete: true,  signal_low_sentiment: 1}
          - {observation_month: "2026-08-01", consumer_sentiment_data_complete: true,  signal_low_sentiment: 1}
          - {observation_month: "2026-09-01", consumer_sentiment_data_complete: false, signal_low_sentiment: 0}

  - name: test_inflation_null_with_no_prior_value
    model: int_recession_signals
    description: >
      The warm-up path on a signal other than the Sahm Rule: nothing has ever
      published, so the as-of month is null, datediff returns null, and only
      the coalesce(..., false) in the completeness CTE keeps the flag from
      being null instead of false. A null flag would break the measured count
      and the not_null test on it.
    given:
      - input: ref('int_indicators_with_changes')
        rows:
          - {observation_month: "2000-01-01", inflation_rate_yoy: }
          - {observation_month: "2000-02-01", inflation_rate_yoy: }
    expect:
      rows:
          - {observation_month: "2000-01-01", inflation_rate_yoy_effective: , inflation_rate_yoy_as_of_month: , inflation_data_complete: false, signal_high_inflation: 0}
          - {observation_month: "2000-02-01", inflation_rate_yoy_effective: , inflation_rate_yoy_as_of_month: , inflation_data_complete: false, signal_high_inflation: 0}
